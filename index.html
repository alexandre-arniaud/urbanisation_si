<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Verger du Coin - POC Urbanisation SI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              sage: {
                50: '#f6f7f4',
                100: '#e8ebe3',
                200: '#d4daca',
                300: '#b5c0a5',
                400: '#96a67f',
                500: '#7a8c62',
                600: '#5f6f4c',
                700: '#4a573d',
                800: '#3d4734',
                900: '#343d2e',
              },
              cream: {
                50: '#fdfcf9',
                100: '#faf7f0',
                200: '#f5f0e3',
                300: '#ebe3ce',
                400: '#ddd0b0',
              },
              terracotta: {
                400: '#d97756',
                500: '#c45a3a',
                600: '#a44a2f',
              },
              bark: {
                600: '#5c4a3d',
                700: '#4a3b30',
                800: '#3d3128',
                900: '#2e2520',
              }
            },
            fontFamily: {
              'display': ['Fraunces', 'Georgia', 'serif'],
              'body': ['DM Sans', 'system-ui', 'sans-serif'],
            },
          }
        }
      }
    </script>
    <style>
        * {
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
        }
        body {
          font-family: 'DM Sans', system-ui, sans-serif;
          background: linear-gradient(180deg, #faf7f0 0%, #f6f7f4 100%);
          min-height: 100vh;
        }
        .font-display {
          font-family: 'Fraunces', Georgia, serif;
        }

        /* Subtle paper texture */
        .paper-texture {
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
          background-size: 150px;
          opacity: 0.03;
          pointer-events: none;
        }

        /* Card hover lift */
        .card-lift {
          transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .card-lift:hover {
          transform: translateY(-4px);
          box-shadow: 0 12px 24px -8px rgba(93, 74, 61, 0.15);
        }

        /* Success pulse animation */
        @keyframes success-pulse {
          0% { transform: scale(0.95); opacity: 0; }
          50% { transform: scale(1.02); }
          100% { transform: scale(1); opacity: 1; }
        }
        .animate-success {
          animation: success-pulse 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Stock bar animation */
        @keyframes stock-fill {
          from { width: 0; }
        }
        .stock-bar {
          animation: stock-fill 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Gentle float for decorative elements */
        @keyframes gentle-float {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-6px); }
        }
        .float-gentle {
          animation: gentle-float 4s ease-in-out infinite;
        }

        /* Fade in stagger */
        @keyframes fade-up {
          from {
            opacity: 0;
            transform: translateY(12px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        .fade-up {
          animation: fade-up 0.5s ease-out forwards;
        }
        .fade-up-delay-1 { animation-delay: 0.1s; opacity: 0; }
        .fade-up-delay-2 { animation-delay: 0.2s; opacity: 0; }
        .fade-up-delay-3 { animation-delay: 0.3s; opacity: 0; }

        /* Custom scrollbar */
        .custom-scroll::-webkit-scrollbar {
          width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
          background: #f6f7f4;
          border-radius: 3px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
          background: #d4daca;
          border-radius: 3px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
          background: #b5c0a5;
        }

        /* Selection color */
        ::selection {
          background: #b5c0a5;
          color: #2e2520;
        }
    </style>
</head>
<body class="text-bark-800">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
